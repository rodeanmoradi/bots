# ros2_control controllers for the standalone (mock hardware) demo.
# Not used when attached to Gazebo — chopped_urdf_v2/config/controllers.yaml is.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

right_arm_controller:
  ros__parameters:
    joints: [rj0, rj1, rj2, rj3, rj4, rj5, rj6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true   # play_demo.py may send a subset of the arm's joints

left_arm_controller:
  ros__parameters:
    joints: [lj0, lj1, lj2, lj3, lj4, lj5, lj6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true   # play_demo.py may send a subset of the arm's joints

right_gripper_controller:
  ros__parameters:
    joints: [right_left_gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true

left_gripper_controller:
  ros__parameters:
    joints: [left_left_gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
